name: Release

# Tag-driven release build: push tag v* → CI builds, tests, and uploads artifacts
# on BOTH platforms: universal APK + AAB (Android) and unsigned IPAs for all three
# iOS support tiers (16 / 18 / 26).
# Signing (Play Store AAB) can be enabled later with an encrypted keystore secret.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Android release build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Accept Android SDK licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build release APK + AAB
        run: gradle --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Unit tests (release gate)
        run: gradle --stacktrace :app:testDebugUnitTest

      - name: Create GitHub release with Android artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

  ios-release:
    name: iOS unsigned IPAs (${{ matrix.label }}) → same release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iOS16
            config: Release
            runner: macos-15
            ipa: EG-iOS16.ipa
          - label: iOS18
            config: Release-iOS18
            runner: macos-15
            ipa: EG-iOS18.ipa
          - label: iOS26
            config: Release-iOS26
            runner: macos-26
            ipa: EG-iOS26.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: EGCore unit tests (release gate)
        run: swift test --package-path ios/Packages/EGCore

      - name: Install XcodeGen
        run: |
          curl -sSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-dist
          echo "XGEN=$(find xcodegen-dist -type f -name xcodegen | head -1)" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: ios
        run: "$XGEN" generate

      - name: Archive app + widget (${{ matrix.config }}, unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project EarthGuardians.xcodeproj \
            -scheme EarthGuardians \
            -configuration "${{ matrix.config }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/EG.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -R build/EG.xcarchive/Products/Applications/EarthGuardians.app build/Payload/
          (cd build && zip -qry "${{ matrix.ipa }}" Payload)

      - name: Attach ${{ matrix.ipa }} to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/${{ matrix.ipa }}
