name: CI

# Earth Guardians — official app (Android + iOS)
# GOLDEN RULE (AGENTS.md): the apps are ONLY built and tested here, on CI. Never locally.
# Every push and every pull request must compile + unit-test green before merge.
#
# Jobs:
#   android       → universal APK (all ABIs, no splits) + AAB + JVM unit tests
#   ios           → EGCore swift test on both toolchains (Xcode 16 + newest)
#   ios-ipa       → three unsigned IPAs, one per iOS support tier:
#                    iOS16 (16.0 floor) · iOS18 (modern kit) · iOS26 (Liquid Glass, Xcode 26)
#   screenshots   → emulator + simulator captures of the main screens
#                    (non-blocking, continue-on-error; rendered into the run summary)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  android:
    name: Android — build + unit tests (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1 (pinned — CI is the single build surface)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Accept Android SDK licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Compile debug + release (unsigned)
        # bundleRelease is required for the AAB artifact below — assembleRelease
        # produces APKs only.
        run: gradle --stacktrace :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Unit tests (parsers, catalog, navigation, theme logic)
        run: gradle --stacktrace :app:testDebugUnitTest

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload universal APK (all ABIs — no splits configured)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-universal-apk
          if-no-files-found: error
          path: app/build/outputs/apk/**/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-release-aab
          if-no-files-found: error
          path: app/build/outputs/bundle/release/*.aab

  ios:
    name: iOS — EGCore tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: EGCore unit tests (pure Foundation — no simulator needed)
        run: swift test --package-path ios/Packages/EGCore

  ios-ipa:
    name: iOS IPA — ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: ios
    strategy:
      fail-fast: false
      matrix:
        include:
          # iOS 16 floor — widest device compatibility, hand-painted glass kit
          - label: iOS16
            config: Release
            runner: macos-15
            ipa: EG-iOS16.ipa
          # iOS 18 — EG_MODERN kit (ContentUnavailableView, symbol effects, scroll targets)
          - label: iOS18
            config: Release-iOS18
            runner: macos-15
            ipa: EG-iOS18.ipa
          # iOS 26 — EG_LATEST kit (Liquid Glass) on the newest Xcode/SDK
          - label: iOS26
            config: Release-iOS26
            runner: macos-26
            ipa: EG-iOS26.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos" || true

      - name: Install XcodeGen (project is generated, never committed)
        run: |
          curl -sSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-dist
          # Absolute path — the generate step shifts to ios/, which would
          # silently break a relative $XGEN.
          echo "XGEN=$(find "$(pwd)/xcodegen-dist" -type f -name xcodegen | head -1)" >> "$GITHUB_ENV"

      - name: Generate Xcode project from project.yml
        working-directory: ios
        run: |
          "$XGEN" generate

      - name: Archive app + widget (${{ matrix.config }}, unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project EarthGuardians.xcodeproj \
            -scheme EarthGuardians \
            -configuration "${{ matrix.config }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/EG.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package unsigned IPA (${{ matrix.ipa }})
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -R build/EG.xcarchive/Products/Applications/EarthGuardians.app build/Payload/
          (cd build && zip -qry "${{ matrix.ipa }}" Payload)
          ls -lh "build/${{ matrix.ipa }}"

      - name: Upload unsigned IPA artifact (${{ matrix.label }})
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-ipa-${{ matrix.label }}
          if-no-files-found: error
          path: ios/build/${{ matrix.ipa }}

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ matrix.label }}
          if-no-files-found: ignore
          path: |
            ios/build/*.log
            /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/**/*.log

  screenshots-android:
    name: Screenshots — Android main screens (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: android
    # Non-blocking on purpose: best-effort captures — a flaky emulator must
    # never hold the pipeline, but the run summary still renders the screens.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download universal APK
        uses: actions/download-artifact@v4
        with:
          name: android-universal-apk

      - name: Boot emulator + capture main screens
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$SDK/platform-tools:$SDK/cmdline-tools/latest/bin:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "system-images;android-34;google_apis;x86_64" "emulator" "platform-tools" > /dev/null
          echo "[sdk] system image / emulator / platform-tools ready"

          # avdmanager can exit 0 yet produce NO avd on these runners (observed:
          # 'Auto-selecting single ABI x86_64' then an empty avd home). Keep its
          # output for diagnosis, verify the .ini actually exists, and hand-roll
          # the AVD as a deterministic fallback if it didn't materialize.
          echo no | avdmanager create avd -n eg-shots \
            -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force \
            > /tmp/avdmanager.log 2>&1 || true
          if ! [ -f "$ANDROID_AVD_HOME/eg-shots.ini" ]; then
            echo "[avd] avdmanager produced no AVD — its log and filesystem scan:"
            tail -20 /tmp/avdmanager.log || true
            find "$HOME" "$SDK" -maxdepth 6 -name "eg-shots*" 2>/dev/null || true
            echo "[avd] hand-rolling eg-shots.avd"
            AVD_DIR="$ANDROID_AVD_HOME/eg-shots.avd"
            mkdir -p "$AVD_DIR"
            cat > "$ANDROID_AVD_HOME/eg-shots.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD_DIR
          path.rel=avd/eg-shots.avd
          target=android-34
          EOF
            cat > "$AVD_DIR/config.ini" <<EOF
          abi.type=x86_64
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.keyboard=yes
          hw.ramSize=3072
          hw.lcd.width=1080
          hw.lcd.height=2400
          hw.lcd.density=420
          hw.device.manufacturer=Google
          hw.device.name=pixel_6
          image.sysdir.1=system-images/android-34/google_apis/x86_64/
          tag.id=google_apis
          disk.dataPartition.size=6G
          EOF
          fi

          # Gate: the emulator must see the AVD by name before we launch it.
          echo "[avd] contents:"; ls -la "$ANDROID_AVD_HOME"
          if ! "$SDK/emulator/emulator" -list-avds 2>/dev/null | grep -q eg-shots; then
            echo "[avd] emulator still cannot see eg-shots:"
            "$SDK/emulator/emulator" -list-avds || true
            exit 1
          fi

          "$SDK/emulator/emulator" -avd eg-shots \
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim \
            > /tmp/emulator.log 2>&1 &
          EMU_PID=$!

          # No blocking `adb wait-for-device` — a dead emulator would stall it
          # forever. Poll instead: alive-process guard + progress heartbeat.
          # Cold boots on CI can take ~8 min; CI cold boots also sometimes emit
          # the device only intermittently, hence generous headroom.
          seen_device=""
          for i in $(seq 1 90); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "emulator process died after ${i} polls — last log lines:"
              tail -40 /tmp/emulator.log
              exit 1
            fi
            dev=$(adb devices | awk '/^emulator-/{print $1; exit}')
            if [ -n "$dev" ]; then
              seen_device="$dev"
              boot=$(adb -s "$dev" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n ')
              if [ "$boot" = "1" ]; then break; fi
            fi
            if [ $((i % 6)) -eq 0 ]; then
              echo "[boot] poll $i — device: ${seen_device:-none} — emulator log tail:"
              tail -5 /tmp/emulator.log
            fi
            sleep 10
          done
          if [ -z "$seen_device" ]; then
            echo "no emulator device ever registered — last log lines:"
            tail -40 /tmp/emulator.log
            exit 1
          fi
          boot=$(adb -s "$seen_device" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n ')
          if [ "$boot" != "1" ]; then
            echo "emulator never completed boot — last log lines:"
            tail -40 /tmp/emulator.log
            exit 1
          fi
          # system_server may not accept input commands immediately after
          # boot_completed — extra airtime plus retries instead of the raw
          # keyevent that third-party runners fail on with "Broken pipe (32)".
          sleep 15
          for i in 1 2 3; do
            adb shell input keyevent 82 > /dev/null 2>&1 && break
            sleep 5
          done
          bash .github/scripts/android-screenshots.sh

      - name: Install Pillow (summary renderer)
        run: |
          python3 -m pip install --user --quiet pillow \
            || python3 -m pip install --break-system-packages --user --quiet pillow

      - name: Render screenshots into the run summary
        run: python3 .github/scripts/render_summary.py "Android — main screens" shots

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-android
          if-no-files-found: ignore
          path: shots/

  screenshots-ios:
    name: Screenshots — iOS main screens (simulator)
    runs-on: macos-15
    timeout-minutes: 45
    needs: ios
    # Non-blocking on purpose (same contract as the Android captures).
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen + generate project
        run: |
          curl -sSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-dist
          # Absolute path — the generate step shifts to ios/, which would
          # silently break a relative $XGEN.
          echo "XGEN=$(find "$(pwd)/xcodegen-dist" -type f -name xcodegen | head -1)" >> "$GITHUB_ENV"

      - name: Generate Xcode project from project.yml
        working-directory: ios
        run: |
          "$XGEN" generate

      - name: Build + boot + capture main screens
        run: bash .github/scripts/ios-screenshots.sh

      - name: Install Pillow (summary renderer)
        # macOS runners manage python3 with PEP 668 (externally-managed
        # environment), so a --break-system-packages fallback is mandatory.
        run: |
          python3 -m pip install --user --quiet pillow \
            || python3 -m pip install --break-system-packages --user --quiet pillow

      - name: Render screenshots into the run summary
        run: python3 .github/scripts/render_summary.py "iOS — main screens" shots

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ios
          if-no-files-found: ignore
          path: shots/
