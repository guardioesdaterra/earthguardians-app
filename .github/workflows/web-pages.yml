name: Web app — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Nuxt SSG + PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python for official Pillow icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install --user Pillow

      - name: Configure project-site base path
        env:
          NUXT_APP_BASE_URL: ${{ vars.NUXT_APP_BASE_URL }}
        run: |
          BASE="${NUXT_APP_BASE_URL:-/${GITHUB_REPOSITORY#*/}/}"
          case "$BASE" in */) ;; *) BASE="$BASE/" ;; esac
          echo "NUXT_APP_BASE_URL=$BASE" >> "$GITHUB_ENV"
          echo "Building with base URL: $BASE"

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Generate PWA icons from the shared official mark
        working-directory: web
        run: npm run icons

      - name: Generate static site
        working-directory: web
        run: npm run generate

      - name: Prepare GitHub Pages artifact
        run: |
          test -f web/.output/public/index.html
          touch web/.output/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/.output/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
